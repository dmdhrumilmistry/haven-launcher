name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Validates the wrapper jar and caches Gradle downloads between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK and unsigned release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: UI smoke tests
        run: ./gradlew --no-daemon testStandardDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14

      - name: Lint
        run: ./gradlew --no-daemon lintStandardDebug lintFullDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: haven-launcher-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
