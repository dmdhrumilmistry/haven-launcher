name: Release

# Push a tag like v1.2.3 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag matches the app version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          expected_code=$(( major * 10000 + minor * 100 + patch ))
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          if [[ "$name" != "${TAG#v}" || "$code" != "$expected_code" ]]; then
            echo "::error::Tag $TAG needs versionName ${TAG#v} and versionCode $expected_code in app/build.gradle.kts (found $name / $code)"
            exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          [[ -n "${BASH_REMATCH[4]}" ]] && echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" || true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HAVEN_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing secret HAVEN_KEYSTORE_BASE64. See 'Releases' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HAVEN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build signed APKs and Play bundle
        env:
          HAVEN_KEYSTORE_PASSWORD: ${{ secrets.HAVEN_KEYSTORE_PASSWORD }}
          HAVEN_KEY_ALIAS: ${{ secrets.HAVEN_KEY_ALIAS }}
          HAVEN_KEY_PASSWORD: ${{ secrets.HAVEN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleFullRelease

      - name: Verify signatures and prepare files
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          for flavor in standard full; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$apksigner" verify --print-certs "$apk"
            suffix=$([[ $flavor == full ]] && echo "-full" || true)
            cp "$apk" "dist/haven-launcher-$TAG$suffix.apk"
          done
          # App bundle for Google Play (full build: Play installs aren't subject to the sideloading block).
          cp app/build/outputs/bundle/fullRelease/app-full-release.aab "dist/haven-launcher-$TAG-play.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          {
            if [[ -f "$changelog" ]]; then
              echo "### What's new"
              echo
              cat "$changelog"
              echo
            fi
            echo "### Which file?"
            echo
            echo "- **haven-launcher-$TAG.apk**: recommended if you install from this page."
            echo "- **haven-launcher-$TAG-full.apk**: adds double-tap to lock and notification badges. They need an accessibility service and notification access, so Google Play Protect may block installing it from a browser in some countries."
            echo "- **haven-launcher-$TAG-play.aab**: the app bundle for Google Play (not installable directly)."
            echo
            echo "Both APKs are signed with the same key and can update each other."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Haven $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $PRERELEASE
          fi

      # Optional: once the app exists in Play Console and a service account is set up
      # (see docs/PUBLISHING.md), each release also goes to the internal testing track.
      - name: Prepare Play "what's new"
        if: env.HAS_PLAY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          # Play allows 500 characters.
          if [[ -f "$changelog" ]]; then head -c 500 "$changelog"; else echo "Bug fixes and improvements."; fi \
            > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.haven.launcher
          releaseFiles: dist/haven-launcher-${{ env.TAG }}-play.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
